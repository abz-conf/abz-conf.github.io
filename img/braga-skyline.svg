<title id="title">Braga skyline</title>
<desc id="desc">A single-color outline panorama of Braga, Portugal: Arco da Porta Nova, Braga Cathedral, traditional rooftops, the medieval keep, and Bom Jesus do Monte with its monumental zigzag stairway. Stylized composition, not a geographic elevation.</desc>
